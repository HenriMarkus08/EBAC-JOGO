<!DOCTYPE html>
<html lang="pt - BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Adivinhação</title>
    <script src="jogo.js"></script>
    <link rel="stylesheet" href="styles.css">

</head>
<body>
    
    <div class="main-container">
    <h1>Escolha entre 1 a 100</h1>
    <h2>Você terá 3 chances.</h2>
    <p>Tente adivinhar o número secreto entre 1 e 100.</p>

    <label for="" > Seu chute: </label> 
    <input type="number" id="valor" placeholder="Digite o número aqui">

    <p id="mensagem">Boa sorte!</p>
    <p id="tentativas">Tentativas restantes: 3</p>
    
    <button onclick="chutar()">Chutar</button>

    </div>
    
</body>
</html>
